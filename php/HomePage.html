<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;      
          align-items: center;         
        }

        h1 {
          margin-top: 40px;           
          margin-bottom: 20px;         
          text-align: center;          
        }
    
        .forms-container {
          display: flex;
          justify-content: center;   
          align-items: flex-start;
          gap: 40px;
          margin-top: 20px;                
        }
    
        form {
          background-color: #ffffff;
          border-radius: 10px;
          border: 2px solid #007bff;
          padding: 24px 32px;
          min-width: 200px;
          text-align: center;        
          display: flex;
          flex-direction: column;
          align-items: center;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
          font-weight: bold;
          font-family: Arial, sans-serif;
          color: #007bff;
          transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
          cursor: pointer;
        }

        form:hover {
          transform: translateY(-4px);
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
          border-color: #0056b3;
        }
        .role-image {
          width: 80px;
          height: 80px;
          border-radius: 50%;
          object-fit: cover;
          margin-bottom: 12px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.15);
          border: 3px solid #ffffff;
        }
      </style>
</head>
<body>
    <h1>Scegli un ruolo</h1>
    <div class="forms-container">
        <form action="" method="post" name="ruolo">
          <img class="role-image" src="userImage.png">
          <b>ADMIN</b>
        </form>
        <form action="" method="post" name="ruolo">
          <img class="role-image" src="userImage.png">
          <b>TUTOR</b>
        </form>
        <form action="" method="post" name="ruolo">
          <img class="role-image" src="userImage.png">
          <b>STUDENTE</b>
        </form>
    </div>
</body>
</html>
