<!DOCTYPE html>
<html lang="it">
<head>
    <!-- Metadati della pagina -->
    <meta charset="UTF-8">
    <title>Registrazione Studente</title>
    <!-- Collegamento ai file CSS di stile -->
    <link rel="stylesheet" href="HomePage.css">
    <link rel="stylesheet" href="registrazioneStudente.css">
</head>
<body style="padding-top: 78px;">
    <!-- ========== HEADER INCLUSO VIA IFRAME ========== -->
    <!-- Header per tutor (headerTutor.html) poiché solo i tutor possono registrare studenti -->
    <iframe
      src="headerTutor.html"
      title="Header"
      style="width: 100%; border: 0; height: 78px; display: block; position: fixed; top: 0; left: 0; z-index: 9999;"
      scrolling="no"
    ></iframe>

    <!-- ========== TITOLO PRINCIPALE ========== -->
    <h1>Registrazione Studente</h1>

    <!-- ========== CONTENITORE DEL FORM ========== -->
    <div class="forms-container">
        <!-- ========== FORM DI REGISTRAZIONE ========== -->
        <!-- Metodo POST per sicurezza -->
        <!-- Action: registrazioneStudente.php elaborerà il form -->
        <form class="registration-form" action="registrazioneStudente.php" method="post">
            
            <!-- SEZIONE 1: DATI ANAGRAFICI -->
            <div class="form-field">
                Nome: <input type="text" id="nome" name="nome" placeholder="Inserisci il nome">
            </div>
            <div class="form-field">
                Cognome: <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome">
            </div>
            <div class="form-field">
                Data di nascita: <input type="date" id="data_nascita" name="data_nascita" placeholder="gg/mm/aaaa">
            </div>
            <div class="form-field">
                Luogo di nascita: <input type="text" id="luogo_nascita" name="luogo_nascita" placeholder="Es. Roma">
            </div>
            
            <!-- SEZIONE 2: INFORMAZIONI PERSONALI -->
            <div class="form-field">
                <label for="sesso">Sesso</label>
                <select id="sesso" name="sesso">
                    <option value="">Seleziona…</option>
                    <option value="M">Maschio</option>
                    <option value="F">Femmina</option>
                </select>
            </div>
            <div class="form-field">
                Email: <input type="email" id="email" name="email" placeholder="nome@esempio.it">
            </div>

            <!-- SEZIONE 3: DATI SCOLASTICI -->
            <div class="form-field">
                Scuola: <input type="text" id="scuola" name="scuola" placeholder="Nome dell'istituto">
            </div>
            <div class="form-field">
                Classe: <input type="text" id="classe" name="classe" placeholder="Es. III, IV">
            </div>
            <div class="form-field">
                Sezione: <input type="text" id="sezione" name="sezione" placeholder="Es. A, B, C">
            </div>
            <div class="form-field">
                <label for="indirizzo_studio">Indirizzo di studio</label>
                <select id="indirizzo_studio" name="indirizzo_studio">
                    <option value="">Seleziona…</option>
                    <option value="informatico">Informatico</option>
                    <option value="afm">AFM</option>
                    <option value="liceo_linguistico">Liceo linguistico</option>
                    <option value="cat">CAT</option>
                    <option value="istituto_agrario">Istituto tecnico/agrario</option>
                    <option value="telecomunicazioni">Telecomunicazioni</option>
                </select>
            </div>

            <!-- SEZIONE 4: CREDENZIALI DI ACCESSO -->
            <div class="form-field">
                Username: <input type="text" id="username" name="username" placeholder="Scegli uno username">
            </div>
            <div class="form-field">
                Password: <input type="password" id="password" name="password" placeholder="La tua password">
            </div>

            <!-- SEZIONE 5: ASSEGNAZIONE DEL TUTOR -->
            <!-- La select viene compilata dinamicamente via JavaScript da tutorDinamici.php -->
            <div class="form-field">
                <label for="id_tutor">Tutor</label>
                <select id="id_tutor" name="id_tutor">
                    <option value="">Seleziona…</option>
                </select>
            </div>

            <!-- ========== BOTTONE DI SUBMIT ========== -->
            <div class="form-actions">
                <input type="submit" value="Registrati">
            </div>
        </form>
    </div>

    <!-- ========== FOOTER INCLUSO VIA IFRAME ========== -->
    <iframe
      src="Footer.html"
      title="Footer"
      style="width: 100%; border: 0; height: 90px; margin-top: auto; display: block;"
      scrolling="no"
    ></iframe>

    <!-- ========== SCRIPT JAVASCRIPT ========== -->
    <!-- Carica dinamicamente la lista dei tutor dal server -->
    <script>
        /**
         * Attende che il DOM sia completamente caricato prima di eseguire il codice
         * Questo assicura che tutti gli elementi HTML siano disponibili
         */
        document.addEventListener("DOMContentLoaded", function() {
            // Ottiene il riferimento alla select dei tutor
            const selectTutor = document.getElementById("id_tutor");

            /**
             * FETCH API:
             * Fa una richiesta HTTP GET al file tutorDinamici.php
             * che ritorna una lista di <option> generata dinamicamente
             */
            fetch("tutorDinamici.php")
                .then(response => response.text())
                .then(htmlGenerato => {
                    /**
                     * Aggiunge le <option> stampate dal PHP dentro la select
                     * htmlGenerato contiene stringhe tipo: <option value="1">Marco Rossi</option>
                     * Append (+=) mantiene l'option "Seleziona…" che è già presente
                     */
                    selectTutor.innerHTML += htmlGenerato;
                })
                .catch(error => {
                    // Gestisce eventuali errori durante il fetch
                    console.error("Errore nel caricamento dei tutor:", error);
                });
        });
    </script>
</body>
</html>
